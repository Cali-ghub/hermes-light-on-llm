name: CI

on:
  push:
  pull_request:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Validate JSON manifests
        run: |
          python -m json.tool dashboard/manifest.json >/dev/null
          python -m json.tool desktop-plugin/manifest.json >/dev/null
      - name: Check for obvious local/private values
        run: |
          ! grep -RInE --exclude-dir=.git '192\.168\.|access_token=[A-Za-z0-9_-]{20,}|HUE_API_KEY=[A-Za-z0-9_-]{20,}|HUBITAT_ACCESS_TOKEN=[A-Za-z0-9_-]{20,}' .
